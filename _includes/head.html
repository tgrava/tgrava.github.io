{% include base_path %}
<script type="importmap">
{
  "imports": {
    "three":      "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
    "three/":     "https://cdn.jsdelivr.net/npm/three@0.128.0/",

    /* If you need controls: */
    "three/examples/jsm/controls/OrbitControls":
      "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/controls/OrbitControls.js",

    /* And your PLYLoader: */
    "three/examples/jsm/loaders/PLYLoader":
      "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/PLYLoader.js"
  }
}
</script>

<!-- Then your module script as before: -->
<script type="module" src="{{ '/assets/js/profile-3d.js' | relative_url }}"></script>
<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<meta http-equiv="cleartype" content="on">
